; Bench test for the Flywoo GOKU GM10 Nano. Standalone on purpose: it shares nothing with firmware/.
;
; Two boards. The XIAO ESP32-S3 is the default and uses the pins of firmware/include/pins.h, plus the
; OLED of tools/oled-sd-test for the status; the plain ESP32-WROOM-32 devkit is kept for comparison.

[platformio]
default_envs = seeed_xiao_esp32s3

[env]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.311
framework = arduino
monitor_speed = 115200
monitor_filters = time
; The GM10 link is shared with tools/oled-sd-test.
lib_deps =
    symlink://../lib/gm10

[env:seeed_xiao_esp32s3]
board = seeed_xiao_esp32s3
; UART1 on D7 (RX) / D6 (TX); OLED on the I2C pins D4 (SDA) / D5 (SCL).
build_flags =
    -DGPS_UART=1
    -DGPS_RX_PIN=44
    -DGPS_TX_PIN=43
    -DHAS_OLED
    -DOLED_SDA_PIN=5
    -DOLED_SCL_PIN=6
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit SSD1306 @ 2.5.17

[env:esp32dev]
board = esp32dev
build_flags =
    -DGPS_UART=2
    -DGPS_RX_PIN=16
    -DGPS_TX_PIN=17
