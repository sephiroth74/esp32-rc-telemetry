; Which GPIO is the microSD's DAT3 (ROADMAP.md step 1.2): GPIO21, as Seeed's examples have it, or
; GPIO3, as their wiki says. It includes firmware/include for the SD pins of pins.h.

[env:seeed_xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.311
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    -I$PROJECT_DIR/../../firmware/include
lib_deps =
    adafruit/Adafruit SSD1306 @ 2.5.17
