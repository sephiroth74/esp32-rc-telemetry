; RC channel graph: one channel's pulse width over time on the OLED, timed by the MCPWM capture
; unit as the firmware will time it (PLAN-ESP32.md §4.3). It includes firmware/include for
; config.h — the RC_* windows and the key ladder — and pins.h.

[env:seeed_xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.311
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    -I$PROJECT_DIR/../../firmware/include
lib_deps =
    adafruit/Adafruit SSD1306 @ 2.5.17
