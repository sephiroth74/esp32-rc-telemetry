; RC channel, live: one channel's pulse width as a bar from the centre of the OLED, timed by the
; MCPWM capture unit as the firmware will time it (PLAN-ESP32.md §4.3). It includes
; firmware/include for config.h — the RC_* windows and the key ladder — and pins.h.

[env:seeed_xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.311
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    -I$PROJECT_DIR/../../firmware/include
lib_deps =
    olikraus/U8g2 @ 2.36.18  ; the firmware's: dirty pages sent on their own (§2.4)
