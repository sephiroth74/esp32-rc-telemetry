; Font comparison on the bench OLED (PLAN-ESP32.md §3.2).
; It includes firmware/include for config.h and pins.h, and uses U8g2 as the firmware does.

[env:seeed_xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.311
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -I$PROJECT_DIR/../../firmware/include
lib_deps =
    olikraus/U8g2
; The board may still run the firmware, whose TinyUSB port needs the 1200-baud touch (see
; firmware/platformio.ini); on the chip's own USB-Serial-JTAG port the touch is harmless.
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
