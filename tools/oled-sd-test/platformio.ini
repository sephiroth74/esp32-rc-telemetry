; Bench demo for the XIAO ESP32-S3 Sense: a 0.96" SSD1306 I2C OLED, the microSD slot and the GM10 GPS.
; Standalone on purpose: it shares nothing with firmware/, but uses the same pins (pins.h).

[env:seeed_xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.311
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
    adafruit/Adafruit SSD1306 @ 2.5.17
    symlink://../lib/gm10           ; the GM10 link, shared with tools/gps-test
