; RC receiver signal scope (ROADMAP.md step 1.5): the level, pulse width and frame period of one
; channel, for the Arduino IDE's Serial Plotter. It includes firmware/include for config.h and
; pins.h: checking the RC_* windows of config.h against a real receiver is part of the point.

[env:seeed_xiao_esp32s3]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.311
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    -I$PROJECT_DIR/../../firmware/include
lib_deps =
    adafruit/Adafruit SSD1306 @ 2.5.17
