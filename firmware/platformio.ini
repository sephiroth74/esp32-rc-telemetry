; RC Telemetry firmware — see PLAN-ESP32.md §6.2
;
; Two environments: the device build, and a host build that compiles only lib/
; so the parsing and geometry code can be unit-tested without hardware (§6.1).

[platformio]
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
; The pioarduino tags carry no "v" prefix. 55.03.311 == Arduino core 3.3.11 /
; ESP-IDF 5.5.5 and is the newest of the 55.03.x line (55.03.39 is 3.3.9).
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.311
board = seeed_xiao_esp32s3
framework = arduino

board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; Without this the size check compares the image against the whole 8 MB flash instead
; of the 4 MB app0 partition, because the builder only auto-detects an `ota_0` app.
board_build.app_partition_name = app0

; Do NOT set board_build.arduino.memory_type here. The board definition already selects
; qio_opi, which the 8 MB *octal* PSRAM of the ESP32-S3R8 requires; forcing qio_qspi
; leaves PSRAM undetected and ps_malloc() returning NULL, which would take the ring
; buffer in §4.4 with it.

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; ARDUINO_USB_MODE=0 selects TinyUSB instead of the hardware CDC/JTAG bridge and is
; mandatory for USB MSC. The board default is 1, so the old value must be unflagged.
; BOARD_HAS_PSRAM and ARDUINO_USB_CDC_ON_BOOT=1 are already in the board's extra_flags
; and must not be repeated.
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=3

; The app's TinyUSB port is not the one the bootloader comes back on: the chip's own
; USB-Serial-JTAG enumerates under a different name. Touch the app's port at 1200 baud
; (the core then restarts into the bootloader), wait for the new port, upload there.
; Without this the first attempt loses its port and fails.
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
; Only the board's own ports (macOS names): with the board unplugged, autodetection would
; otherwise pick any serial port — a Bluetooth headset — and send it the 1200-baud touch.
; scripts/upload_port.py resolves the pattern first, since the touch would open it literally.
; Override with `pio run -t upload --upload-port <port>` on other systems.
upload_port = /dev/cu.usbmodem*
extra_scripts = pre:scripts/upload_port.py

; No GNSS library: the UBX parser is ours (§5.4).
; Pin every entry to = x.y.z once the first build succeeds.
lib_deps =
    h2zero/NimBLE-Arduino          ; must resolve to 2.x — 1.x targets Arduino core 2.x / IDF 4.x
    olikraus/U8g2                  ; display: dirty-page updates keep the shared I²C bus free (§2.4)
    bblanchon/ArduinoJson @ 7.4.3   ; config.json (lib/cfg); the host tests use the same
    adafruit/Adafruit LSM6DS

; Every test under test/ is a host test (§6.1). None of them belong on the device.
test_ignore = *

; The bench simulation (include/bench_sim.h): the receiver and the keys from the serial console,
; for testing without the car. Never for the car: `pio run -e sim -t upload`.
[env:sim]
extends = env:seeed_xiao_esp32s3
build_flags = ${env:seeed_xiao_esp32s3.build_flags} -DBENCH_SIM

[env:native_test]                  ; host-side tests for lib/ubx, lib/rcl, lib/geo, lib/ui, lib/cfg
platform = native
test_framework = unity
; FIXTURES_DIR: the golden files the host tests share with rct_core (docs/fixtures/README.md).
build_flags = -std=gnu++17 -DUNIT_TEST -Wall -Wextra
    -DFIXTURES_DIR=\"$PROJECT_DIR/../docs/fixtures\"
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
